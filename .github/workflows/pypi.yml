name: Publish to PyPI

# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token to store.
# Before the first run, register this repository as a trusted publisher on PyPI:
#   https://pypi.org/manage/project/wheel-crypto-scan/settings/publishing/
#   workflow: pypi.yml, environment: pypi
# Until that is configured the publish step will fail with a 403, and nothing else will.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check --strict dist/*
      - name: Confirm the version matches the tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          tag=${GITHUB_REF_NAME#v}
          if [ "$built" != "$tag" ]; then
            echo "::error::project version $built does not match release tag $tag"
            exit 1
          fi
          echo "version $built matches tag $tag"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-pypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/wheel-crypto-scan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wheel-crypto-scan
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
