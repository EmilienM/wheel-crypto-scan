site_name: wheel-crypto-scan
site_description: >-
  Deterministic crypto inventory for Python wheels, with FIPS compatibility as one
  lens over it. It gathers evidence; it does not decide FIPS compliance.
site_url: https://my1.fr/wheel-crypto-scan/
repo_url: https://github.com/EmilienM/wheel-crypto-scan
repo_name: EmilienM/wheel-crypto-scan
edit_uri: edit/main/docs/
copyright: Apache 2.0. The tool reports evidence; a human decides.

docs_dir: docs

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

plugins:
  - search

# With --strict these become errors, so a broken cross-page link or a heading anchor
# that no longer exists fails the build rather than shipping a 404.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Using it:
      - Install and run: usage.md
      - Output schema: output-schema.md
      - Schema contract (full text): SCHEMA.md
      - The ruleset: ruleset.md
  - Internals:
      - Architecture: architecture.md
      - Invariants: invariants.md
      - Vocabularies: reference/vocabularies.md
  - Design:
      - Overview: design-summaries/index.md
      - Full ledger: DESIGN.md
      - Determinism and the Python layer: design-summaries/interpreter.md
      - Evidence, opacity and verdicts: design-summaries/opacity.md
      - OpenSSL linkage: design-summaries/linkage.md
      - Policy data: design-summaries/policy.md
      - Caps, budgets and record size: design-summaries/limits.md
      - ELF: design-summaries/elf.md
      - Mach-O: design-summaries/macho.md
      - PE: design-summaries/pe.md
      - Scanning, caching and layout: design-summaries/tooling.md
  - Contributing: contributing.md
