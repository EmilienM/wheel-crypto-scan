[build-system]
requires = ["hatchling>=1.18", "uv-dynamic-versioning>=0.6"]
build-backend = "hatchling.build"

[project]
name = "wheel-crypto-scan"
dynamic = ["version"]
description = "Deterministic FIPS-risk evidence inspector for Python wheels"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Emilien Macchi", email = "emacchi@redhat.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["fips", "wheel", "crypto", "sbom", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pyelftools>=0.31",
    "packaging>=23.2",
]

[project.scripts]
wheel-crypto-scan = "wheel_crypto_scan.cli:main"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
pattern = "^(?P<base>\\d+\\.\\d+\\.\\d+)$"
fallback-version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["src/wheel_crypto_scan"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real: opt-in tests that need real wheels in WCS_CORPUS_DIR (deselected by default)",
    "hostbin: opt-in tests that read real system binaries such as /usr/lib64/libcrypto.so.3",
]

[tool.pylint.main]
py-version = "3.11"
jobs = 0

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# Each of these is a deliberate design choice rather than an oversight. The reasons
# are recorded here so a future contributor can tell the difference.
disable = [
    # Almost every case is a `sort_key()` or a one-line accessor whose name already
    # says everything a docstring would. The public API that carries judgement is
    # documented at module and class level.
    "missing-function-docstring",
    # Rule matchers all take the same (rule, match, ruleset, evidence, linkage, index)
    # signature so the engine can dispatch them from one table. Most ignore most of it.
    "unused-argument",
    # Deliberate: one malformed wheel out of thirty thousand must become an error
    # record, never an exception that aborts the run.
    "broad-exception-caught",
    # Evidence and record types are wide because the output contract is wide.
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-statements",
    "too-few-public-methods",
    # The binary readers share a deliberate shape; collapsing them would couple the
    # ELF and Mach-O paths to each other.
    "duplicate-code",
    # Worker process state, set exactly once in the pool initializer.
    "global-statement",
    # mkstemp is used for its file descriptor, which `with` would not give us.
    "consider-using-with",
]
