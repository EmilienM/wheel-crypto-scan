# wheel-crypto-scan ruleset
# =========================
#
# This file is the whole domain model. You can review and edit it without reading any
# Python. Nothing in the scanner hardcodes a package name, a symbol, a library or a
# verdict; all of that lives here.
#
# How to read an entry
# --------------------
#   severity            How strong the evidence is (high / medium / low / info).
#                       It is NOT a compatibility judgement.
#   verdict             Which class this evidence pushes the wheel into. The tool never
#                       emits a passing class, not "compliant" and not "compatible", and
#                       this field can never say so.
#   confidence          How sure we are the match means what we think it means.
#   needs_human_review  Set true whenever a crypto engineer must look at it. When in
#                       doubt, set it true. It is never wrong to ask for review.
#   why                 Why this is flagged, in plain language. Every rule and every
#                       table entry has one. If you disagree with a `why`, change it:
#                       it is the part of this file that carries the reasoning.
#
# Verdict classes
# ---------------
#   NON_APPROVED_CRYPTO  Implements or bundles a non-FIPS-approved primitive.
#   CONDITIONAL          Approved only under a stated condition, normally "linked
#                        against the system OpenSSL so it can pick up the system FIPS
#                        provider". The record says which condition actually holds.
#   FIPS_BREAKING        Will raise at runtime under FIPS-enforcing mode.
#   CONTEXT_DEPENDENT    Non-approved primitive that may be a non-security use.
#   OPAQUE               Stripped binary, no source, unreadable. Cannot determine.
#   NO_CRYPTO_DETECTED   Nothing found. Absence of evidence, not evidence of absence.
#
# Bump `ruleset_version` on every substantive change. It is part of the scan cache key,
# so bumping it is what makes previously scanned wheels get re-evaluated.

ruleset_version = "41"


# ---------------------------------------------------------------------------
# Verdict resolution
# ---------------------------------------------------------------------------
[verdict]
# A wheel can produce evidence for several classes at once. The record reports every
# class that fired in `verdict.classes`, and the first one in this list as the single
# `verdict.class`. Reorder this list to change which concern wins.
precedence = [
    "NON_APPROVED_CRYPTO",
    "FIPS_BREAKING",
    "CONDITIONAL",
    "CONTEXT_DEPENDENT",
    "OPAQUE",
    "NO_CRYPTO_DETECTED",
]


# ---------------------------------------------------------------------------
# Output limits. They bound record size; they never change what is detected.
# Lists are sorted before truncation, so truncation stays deterministic.
# ---------------------------------------------------------------------------
[limits]
max_locations_per_finding = 10
max_symbols_per_binary = 64
max_strings_per_binary = 64
max_rust_crates_per_binary = 128
max_evidence_chars = 200
min_string_length = 4


# ---------------------------------------------------------------------------
# Packaging conventions. These describe how build tools lay wheels out, not policy.
# ---------------------------------------------------------------------------
[conventions]
# auditwheel (Linux), delocate (macOS) and delvewheel (Windows) copy shared libraries
# into these directories. Anything in here is shipped by the wheel rather than borrowed
# from the system.
vendor_dir_globs = ["*.libs", ".dylibs", "*.dylibs"]

# auditwheel, delocate and delvewheel rename a vendored library by appending a content
# hash, e.g. libcrypto-3a1f2b4c.so.3 or libcrypto-3-x64-a1b2c3d4.dll. A needed-entry or
# SONAME that looks like this is a vendored copy even when the wheel has no vendor
# directory of its own.
mangled_soname_regex = '^(?P<stem>lib.+)-(?P<hash>[0-9a-f]{6,32})$'

# Extensions stripped when reducing a library file name to its base name. Windows
# entries matter: without them a vendored libcrypto-<hash>.dll would be normalised to
# a name that matches nothing, and the bundled-OpenSSL check would miss every Windows
# wheel while the version banner quietly mislabelled it as statically linked.
library_suffixes = [".so", ".dylib", ".dll", ".pyd"]

# The subset of library_suffixes that names a Windows object. A name carrying one of
# these is casefolded, because Windows file names are case-insensitive and an import
# names its DLL in whatever case the linker wrote, and is then reduced by
# windows_version_suffix_regex.
windows_library_suffixes = [".dll", ".pyd"]

# Windows puts a library's version, and often its architecture, inside the file name
# where Unix puts it in a .so.N suffix: libcrypto-3-x64.dll, libgnutls-30.dll,
# libnettle-8.dll, libgcrypt-20.dll. That is how the platform spells a name, not a fact
# about any one library, so it is undone here rather than enumerated library by library
# -- which would fix whichever library someone happened to think of and leave the rest
# resolving to nothing. The architecture is matched as a token rather than enumerated
# for that same reason: `x64|x86|arm64|arm64ec` was four spellings of a field whose
# fifth spelling (a vendor writing aarch64) would have left libcrypto-3-aarch64.dll
# resolving to no library at all. Over-stripping a name that is not an architecture
# costs a suffix on a name we then match more broadly, which is the safe direction here.
# Applied only to names that carried a Windows suffix, because a
# Unix libfoo-2.so really is called libfoo-2, and applied after the content hash is
# stripped, so a vendored libcrypto-3-x64-<hash>.dll is still recognised as vendored.
windows_version_suffix_regex = '^(?P<stem>.+?)-(?P<version>[0-9]+(_[0-9]+)?)(-(?P<decoration>[A-Za-z0-9_]+))?$'

# Go toolchain string groups, named here rather than in the Go reader, so renaming a
# group in this file cannot silently flip a verdict-relevant field in the record. Every
# Go group belongs here, not just the ones a rule reads: `binaries[].go.markers` is the
# structured summary a consumer reads instead of the findings, and a group the reader
# does not know about makes that summary contradict the verdict built from the same
# evidence -- a FIPS build reporting markers ["go_stock_crypto"] while its verdict says
# BIN_GO_FIPS140.
go_boring_group = "go_boring"
go_stock_group = "go_stock_crypto"
go_fips140_group = "go_fips140"

# Rust objects embed the source path of every crate they were built from. Both
# separators, because the path is spelled the way the machine that built the wheel
# spells one: cryptography 50.0.1's win_amd64 .pyd carries 153 `cargo\registry` paths
# and no `cargo/registry` path, so a forward-slash-only pattern reads every Rust wheel
# built on Windows as carrying no crates at all. The `src/<index>/` segment is
# optional because distro packaging (Fedora's `/usr/share/cargo/registry/<name>-
# <version>/`, laid out by the RPM Rust macros) has none. That segment's negated
# class excludes `\n`, the run separator `binfmt.strings.RUN_SEPARATOR` joins printable
# runs with: without that exclusion a match can start in one printable run and finish
# in an unrelated one, naming a crate neither string names. The name excludes `.`,
# which no crates.io crate name can contain, and is lazy and bounded at 64 characters
# (crates.io's own limit); the version tail is bounded at 64 characters too, the same
# as the vendor pattern's below. An unbounded name and version tail backtrack
# quadratically over a long slash-free segment of `name-version` near-misses only when
# `.` is also allowed in the name; excluding it keeps the unbounded shape linear on its
# own, and allowing it back in costs several times more per MiB even with these bounds
# in place. DESIGN.md, "Crates are read from every cargo source layout, and a vendored
# crate has no version", has the measurement.
cargo_path_regex = '''cargo[/\\]registry[/\\](?:src[/\\][^/\\\x00"'\n]{1,255}[/\\])?(?P<name>[A-Za-z0-9_][A-Za-z0-9_-]{0,63}?)-(?P<version>[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]{0,63})[/\\]'''

# `cargo vendor` (what fromager uses to build offline) writes `vendor/<name>/...` with
# no `cargo/registry` segment at all and, without `--versioned-dirs`, no version either,
# so it needs its own pattern rather than an alternative branch of the one above: Python
# `re` refuses two groups with the same name in one pattern. The version group is
# optional for the same reason, and a crate read through this convention records a null
# version rather than an invented one. The path must contain `.rs` past the crate
# directory, with no terminator required after it (Rust panic locations are not
# NUL-terminated the way a C string literal would be): C and Go projects vendor trees
# too (`vendor/openssl/crypto/evp/evp_enc.c`, `vendor/golang.org/x/crypto/...go`), and
# without that anchor a vendored C OpenSSL would be misread as the Rust crate named
# `openssl`. Because the match has no terminator, a `.rst`/`.rsp` file, or a `.rs`
# elsewhere in the same printable run, also matches; that is a known gap, not a
# guarantee this anchor makes. The pattern always anchors on the first `vendor/`
# component it finds, so a build tree that itself sits inside a directory named
# `vendor` collapses every crate nested inside it into one crate named after that
# outer component. That is a known gap too, left open because closing it would need the
# pattern to fail past a nested `vendor/` rather than consume through it; DESIGN.md,
# "Crates are read from every cargo source layout, and a vendored crate has no
# version", has the example.
# `vendor/gimli-0.32.3/` -- cargo's own `--versioned-dirs` layout, and how rustc vendors
# its own dependencies -- reads as `gimli` version `0.32.3` rather than as a crate
# literally named `gimli-0.32.3` with no version, because the name class excludes `.`:
# a crates.io name can never contain one, a version always opens with a digit run
# followed by `.`, and with `.` unavailable to the name the version's leading `-` is
# necessarily the last `-` before the first `.`. The split is therefore unique, and the
# name group being lazy (like the registry pattern's) neither helps nor hurts it.
# Allowing `.` in the name gives the two groups' leading digits more ways to split the
# same text, and that ambiguity makes a run of digit-and-dot near-misses cost 3.7s per
# MiB instead of 0.4s. Every repetition is bounded (crate names cap at 64 characters on
# crates.io, path segments at 255, nesting at 16 levels) so the pass over a
# multi-megabyte string table stays linear instead of quadratic, and every negated class
# excludes `\n`, the run separator `binfmt.strings.RUN_SEPARATOR` joins printable runs
# with, so a match can never bridge two runs that never sat next to each other in the
# object. A `vendor/` tree inside a registry crate's own directory
# (`.../bar-1.0.0/vendor/ring/src/x.rs`) is that crate's vendored source, not a crate
# of its own; `binfmt.rust` reads `bar` there and drops the nested `ring` match rather
# than reporting it as a second, unversioned crate.
cargo_vendor_path_regex = '''(?<![A-Za-z0-9_.-])vendor[/\\](?P<name>[A-Za-z0-9_][A-Za-z0-9_-]{0,63}?)(?:-(?P<version>[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]{0,63}))?[/\\](?:[^/\\\x00"'\n]{1,255}[/\\]){0,16}?[^/\\\x00"'\n]{0,255}?\.rs'''

# A crate pinned by a git dependency (a fork, or a revision ahead of the last
# release) is not in a registry or vendor tree at all: cargo checks it out under
# `$CARGO_HOME/git/checkouts/<repo>-<16 hex content hash>/<short rev>/...`. Neither
# cargo convention above matches that layout, so a git-pinned `ring` or `rustls`
# records no crate without this one. CARGO_HOME is whatever the build set it to --
# a custom directory, or `/usr/local/cargo` in the Rust Docker images -- so the
# pattern anchors on `git[/\\]checkouts[/\\]` with a boundary rather than on
# `cargo[/\\]git[/\\]checkouts[/\\]`. The checkout directory is named after the
# repository, not any one crate inside it: for a workspace repo (most crypto crates
# are workspace members: `hashes` holds `sha2`, `rust-openssl` holds `openssl-sys`,
# `rustls` holds `rustls`, `aws-lc-rs` holds `aws-lc-sys`), the optional `member`
# group walks past the `<repo>-<hash>/<rev>/` prefix and any intermediate
# directories to the one immediately holding `src/`, and that directory is read as
# the crate name. When `member` does not match -- a root crate with no workspace
# member directory of its own, such as `ring` -- the conditional `(?(member)|...)`
# instead requires `name` to be followed directly by `-<16 hex>/<rev>/`, which is
# what splits a name that itself contains `-` (or ends in what looks like hex) from
# the hash uniquely. Either way the crate is read under its repository's name, not
# its own, when the two differ (`rust-base64`, not `base64`): a `[[rust_crate]]`
# entry does not claim a root crate whose repository is named differently, and a
# member directory is conventionally but not necessarily the same as the crate
# it holds. `version` is declared but can never participate, `(?P<version>(?!))?`:
# a git checkout names a revision, not a version, so a crate read through this
# convention records a null version, the same as a `cargo vendor` tree without
# `--versioned-dirs`. Like the vendor pattern, `.rs` is required past `src/` so a
# `-sys` crate's own vendored C tree does not misread as the crate holding it
# (`libgit2-sys/libgit2/src/foo.c` is not `libgit2`), with no terminator required
# after it for the same reason a Rust panic location is not NUL-terminated; every
# repetition is bounded and every negated class excludes `\n`, the run separator
# `binfmt.strings.RUN_SEPARATOR` joins printable runs with, for the reasons given
# above the vendor pattern. A `vendor/` tree inside a git checkout member reads
# correctly: `cargo_vendor_path_regex` matches on its own `vendor/` component
# regardless of what layout surrounds it. DESIGN.md, "Crates are read from every
# cargo source layout, and a vendored crate has no version", has the measurement.
cargo_git_path_regex = '''(?<![A-Za-z0-9_.-])git[/\\]checkouts[/\\](?P<member>[^/\\\x00"'\n]{1,255}?-[0-9a-f]{16}[/\\][0-9a-f]{7,40}[/\\](?:[^/\\\x00"'\n]{1,255}[/\\]){0,16}?)?(?P<name>[A-Za-z0-9_][A-Za-z0-9_-]{0,63}?)(?(member)|-[0-9a-f]{16}[/\\][0-9a-f]{7,40})[/\\]src[/\\](?:[^/\\\x00"'\n]{1,255}[/\\]){0,16}?[^/\\\x00"'\n]{0,255}?\.rs(?P<version>(?!))?'''

# Python hash constructors that a FIPS-enforcing build refuses unless the caller passes
# usedforsecurity=False.
refused_hash_algorithms = ["md4", "md5", "md5-sha1", "ripemd160", "sm3", "whirlpool"]
restricted_hash_algorithms = ["sha1"]


# ---------------------------------------------------------------------------
# Linkage policy. Which of `partial_reasons`' causes cost us an answer about how a
# crypto library is linked, and which leave it answerable.
#
# Named `linkage_policy` rather than `linkage` because three different things in this
# tool are already called linkage: the resolved posture per library, `kind = "linkage"`
# which matches on those postures, and this, which is about neither.
#
# `resolve_linkage` reads `partial_analysis` causes, not only `is_opaque` and the
# binary-stage errors. Otherwise an object a reader explicitly marks as not read in
# full, but that records no error, would still contribute a definite posture. A
# stripped macOS extension is the everyday case: one field says its symbol table was
# not read, the next says `openssl_linkage: none`, and the second is a claim the first
# says we cannot make.
#
# Reading `partial_analysis` wholesale would be wrong in the other direction. Some
# causes are conventions rather than failures, and some cost evidence linkage never
# reads, so every ordinal import would have turned into `openssl_linkage: unknown`.
# What follows is the same kind of split [[rule]] draws for verdicts, drawn again for
# linkage -- and it is deliberately not the same list, which is why it is a list of
# its own rather than a second use of `BIN_PARTIAL_ROUTINE`'s.
#
# It excludes rather than includes for the reason the strict rule does: a cause added
# later costs us the answer until someone decides otherwise, which is the safe
# direction. `linkage` reads `needed`, `vendored_path`, the imported/defined split in
# `matched_symbols`, and `matched_strings`; a cause that can cost any of those belongs
# nowhere near this list.
#
# One coherence rule is enforced at load time rather than left to prose. Every cause a
# verdict-less rule claims must appear here too: a cause that records no verdict has
# promised the wheel is not on its own worth a human's time, and making it cost the
# linkage answer puts it straight back on the triage list through
# BIN_OPENSSL_LINKAGE_UNKNOWN. A ruleset omitting this table entirely gets exactly
# those causes and no more, so leaving it out is coherent rather than conservative.
# ---------------------------------------------------------------------------
[linkage_policy]
why = "A cause on this list leaves every field linkage reads intact, so an object carrying it can still be given a definite posture. Everything else, named or added later, makes the wheel's answer `unknown` rather than `none` -- for the libraries reported unconditionally, which is where a false `none` does the damage."
exclude_reasons = [
    # The DLL is still named in `needed`, and `needed` is the first thing a posture is
    # read off, which is the same reason BIN_PARTIAL_ROUTINE claims it. That covers a
    # DLL whose name is a soname this file knows; it does not cover an ordinal import
    # from a DLL nothing here recognises, where what is lost is the imported symbol
    # that would otherwise have made the object `unknown`. Kept anyway, because
    # costing the answer for every ordinal import is the noise BIN_PARTIAL_ROUTINE
    # exists to remove and WS2_32 is bound this way on every socket-using extension.
    # A test pins the shape that is given up.
    "pe_ordinal_import",
    # `.go.buildinfo` carries Go toolchain provenance and feeds the `go` object. No
    # field linkage reads comes from it.
    "elf_go_buildinfo_unread",
    # An absence the reader observed rather than a read it failed at. It fires when the
    # optional header points at no import directory, or when the walk finished and
    # named no DLL; a walk that actually fell short carries `pe_import_incomplete`,
    # which is not on this list. A resource-only or statically linked DLL importing
    # nothing is the ordinary shape here, and its `needed` really is empty -- a dynamic
    # dependency on libcrypto would be in the directory that is not there. The static
    # copy such an object might carry is still read off its exports and its banner.
    "pe_no_import_directory",
]


# ---------------------------------------------------------------------------
# Distributions. Matched on the canonical (PEP 503) project name, so "PyNaCl",
# "pynacl" and "py_nacl" are the same entry.
# ---------------------------------------------------------------------------

[[crypto_distribution]]
name = "bcrypt"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "password_hash"
why = "Implements the Blowfish-based bcrypt password hash. Blowfish is not a FIPS-approved algorithm and there is no configuration that makes it one."

[[crypto_distribution]]
name = "pycryptodome"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "Self-contained cryptographic library. Implements its own AES, RSA, hashes and RNG in bundled C, so it never consults the system crypto policy or FIPS provider."

[[crypto_distribution]]
name = "pycryptodomex"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "Same code as pycryptodome under the Cryptodome namespace. Self-contained implementation, independent of the system FIPS provider."

[[crypto_distribution]]
name = "pycrypto"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "Unmaintained predecessor of pycryptodome with known vulnerabilities. Self-contained implementation."

[[crypto_distribution]]
name = "pynacl"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "Python binding for libsodium. Ships Curve25519, Ed25519, XSalsa20-Poly1305 and Argon2, none of which come from a FIPS-validated module here."

[[crypto_distribution]]
name = "libnacl"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "ctypes binding to libsodium/NaCl. Same primitive set as pynacl, loaded at runtime."

[[crypto_distribution]]
name = "pysodium"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "library"
why = "Another libsodium binding. Same primitives as pynacl."

[[crypto_distribution]]
name = "rsa"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "signature"
why = "Pure-Python RSA implementation. RSA itself is approved, but a pure-Python implementation is not a validated module and cannot be, so it is evidence of crypto performed outside the system provider."

[[crypto_distribution]]
name = "ecdsa"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "signature"
why = "Pure-Python ECDSA implementation. Same reasoning as rsa: the algorithm may be approved, the implementation is not validated and runs outside the system provider."

[[crypto_distribution]]
name = "fastecdsa"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "signature"
why = "Own C implementation of ECDSA. Does not use the system provider."

[[crypto_distribution]]
name = "ed25519"
rule = "DIST_NON_APPROVED_CRYPTO"
needs_human_review = true
family = "signature"
why = "Own Ed25519 implementation. EdDSA status depends on the standard revision and on validation of the specific module, so the classification here needs a crypto engineer's confirmation."

[[crypto_distribution]]
name = "coincurve"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "signature"
why = "Bundles libsecp256k1. The secp256k1 curve is not in the approved curve set."

[[crypto_distribution]]
name = "argon2-cffi"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "password_hash"
why = "Argon2 password hashing. Not a FIPS-approved key derivation function."

[[crypto_distribution]]
name = "argon2-cffi-bindings"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "password_hash"
why = "Bundles the Argon2 reference implementation used by argon2-cffi."

[[crypto_distribution]]
name = "scrypt"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "kdf"
why = "scrypt key derivation, implemented in the package. Not FIPS-approved."

[[crypto_distribution]]
name = "passlib"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "password_hash"
why = "Password hashing framework that selects schemes such as bcrypt, Argon2 and unsalted MD5 crypt. Which scheme is reachable depends on application configuration, so review what it is configured to use."
needs_human_review = true

[[crypto_distribution]]
name = "pyaes"
rule = "DIST_NON_APPROVED_CRYPTO"
family = "block_cipher"
why = "Pure-Python AES. Approved algorithm, unvalidated implementation, outside the system provider."

[[crypto_distribution]]
name = "cryptography"
rule = "DIST_SYSTEM_CRYPTO_WRAPPER"
family = "library"
why = "The important case. It can either link the system OpenSSL, in which case it inherits the system FIPS provider, or carry its own OpenSSL statically or in cryptography.libs/, in which case it does not. Read verdict.conditions.openssl_linkage in the record to see which build this is."

[[crypto_distribution]]
name = "pyopenssl"
rule = "DIST_SYSTEM_CRYPTO_WRAPPER"
family = "library"
why = "Thin wrapper over whatever OpenSSL the installed cryptography package provides. Its posture is inherited from that build, not from this wheel."

[[crypto_distribution]]
name = "m2crypto"
rule = "DIST_SYSTEM_CRYPTO_WRAPPER"
family = "library"
why = "SWIG binding to OpenSSL. Normally links the system libcrypto, which is the good case, but check the binary evidence rather than assuming."

[[crypto_distribution]]
name = "pycurl"
rule = "DIST_SYSTEM_CRYPTO_WRAPPER"
family = "tls"
why = "Binds libcurl, which delegates TLS to whichever stack it was built against. A wheel bundling its own libcurl can also bundle a TLS stack with it."

[[crypto_distribution]]
name = "paramiko"
rule = "DIST_SYSTEM_CRYPTO_WRAPPER"
needs_human_review = true
family = "ssh"
why = "SSH implementation that performs its own algorithm negotiation on top of cryptography. The primitives come from cryptography, the algorithm choice does not, so the negotiated set needs review."

[[crypto_distribution]]
name = "certifi"
rule = "DIST_BUNDLED_TRUST_STORE"
family = "trust_store"
why = "Ships its own CA bundle. Not a crypto implementation, but code using it bypasses the system trust store and therefore the system trust policy."

[[crypto_distribution]]
name = "blake3"
rule = "DIST_NON_CRYPTO_HASH"
family = "hash"
why = "BLAKE3 is a fast general-purpose hash. Not FIPS-approved, and frequently used for checksums and caching rather than security. Decide by use, not by presence."

[[crypto_distribution]]
name = "xxhash"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "Non-cryptographic hash used for checksums, deduplication and hash tables. Flagged so a human can confirm it is not doing security work."

[[crypto_distribution]]
name = "murmurhash"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "Non-cryptographic hash, common in NLP and ML feature hashing (spaCy pulls it in). Almost never a security use, but confirm."

[[crypto_distribution]]
name = "mmh3"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "MurmurHash3 binding. Same reasoning as murmurhash."

[[crypto_distribution]]
name = "cityhash"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "Non-cryptographic hash for hash tables and sharding."

[[crypto_distribution]]
name = "farmhash"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "Non-cryptographic hash, successor to cityhash."

[[crypto_distribution]]
name = "crc32c"
rule = "DIST_NON_CRYPTO_HASH"
family = "checksum"
why = "Checksum, not a hash function in the security sense. Included so storage and networking code that uses it is visible rather than surprising."


# ---------------------------------------------------------------------------
# Native crypto libraries. `sonames` are base names; before matching, the scanner
# strips version suffixes (.so.3, .3.dylib), the Windows decoration that spells those
# in the stem instead (-3-x64), and auditwheel/delocate/delvewheel content hashes.
#
# An entry's optional `rule` routes the bundled-library finding for that library, and
# nothing else. The DT_NEEDED and linkage rules read this table too and do not consult
# it, so they fire the same whether or not an entry sets it.
# ---------------------------------------------------------------------------

[[crypto_library]]
name = "openssl"
# libeay32 and ssleay32 are the OpenSSL 1.0.2 era Windows names: a genuinely different
# name for the same library, which only someone who knows OpenSSL can supply, so they
# belong here. The Windows spellings that are the same name with the version and the
# architecture glued on -- libcrypto-3-x64.dll and its relatives -- are a packaging
# convention rather than a fact about OpenSSL, and [conventions] reduces them back to
# libcrypto before this list is consulted.
sonames = ["libcrypto", "libssl", "libeay32", "ssleay32"]
# These two let the linkage resolver recognise an OpenSSL that was compiled straight
# into an extension, where there is no library file and no dependency to find.
symbol_group = "openssl"
string_group = "openssl_banner"
# The banner is a header macro: any consumer that includes OpenSSL's headers compiles
# the current OPENSSL_VERSION_TEXT in, whether or not it links OpenSSL at all -- a
# dependency the object resolves to the host or to a copy the wheel bundles is enough
# to raise the question. On an object with no dependency on the library at all,
# `openssl_banner` also matches prose naming a dotted OpenSSL version, so the same
# question applies there too: only OpenSSL's own OpenSSL_version() also returns the
# "OPENSSLDIR: " string, from the same switch, so a compiled-in copy that keeps its
# banner keeps this string beside it and a header or a sentence never does.
copy_string_group = "openssl_build_info"
# AWS-LC and BoringSSL implement OpenSSL's API under OpenSSL's own names. An object
# carrying either defines EVP_*/BN_*/BIO_new and the rest of the names the "openssl"
# symbol_group claims, so a definition there says an OpenSSL-API library was compiled
# in, not that it is OpenSSL. It reads unknown, never none, because an object can
# carry a real OpenSSL and a fork at once, and lowercase aws-lc also matches the
# cargo path of aws-lc-rs, a Rust binding rather than a build of AWS-LC itself.
# Measured: awscrt 0.36.4 (a C AWS-LC build, 58 defined AWSLC_* names), curl_cffi
# 0.16.3 (BoringSSL, 16 defined BORINGSSL_*/CRYPTO_BUFFER_* names) and the aws-lc-rs
# 1.18.1 fips cdylib (aws_lc_fips_* names) each read static without these lists, and
# none of the three carries an openssl_banner match. AWS-LC's and BoringSSL's own
# public headers do define OPENSSL_VERSION_TEXT as one literal naming the fork, so a
# banner beside a fork marker is not ruled out on that account -- linkage tells the
# fork's own header banner apart from a real one by testing the banner's own text
# against these string groups' own patterns, not by assuming a fork never produces a
# banner at all.
fork_symbol_groups = ["aws_lc", "aws_lc_fips", "boringssl"]
fork_string_groups = ["aws_lc", "aws_lc_fips", "boringssl"]
# BoringSSL's own FIPS module is not a separate group here: it shares the same
# "boringssl" symbol and string evidence, so this list already covers it.
# A Rust crate that binds OpenSSL says the object uses it, not which copy: openssl-sys
# links the host's or vendors its own on a build feature the object does not record,
# and OPENSSL_NO_VENDOR sends even a `vendored` build back to the host's. So a listed
# crate on an object with no other OpenSSL evidence reads `unknown`, the same as
# imported symbols with no declared provider, and never a definite posture. Each name
# must also be a [[rust_crate]] entry, which is what keeps it past the crate cap.
# The same names, or the library's own name "openssl" itself, in a shipped PEP 770
# SBOM give the same `unknown` when no object in the wheel answers definitely.
# The same SBOM naming also withholds DERIVED_SYSTEM_OPENSSL_ONLY beside a
# system-linked object, unless that very object is the one whose own cargo paths
# carry the named crate: a system-linked object that names its own openssl-sys is
# the ordinary shape of a system-linked Rust build, not a second, unaccounted-for
# copy, so it does not cost the "every piece of evidence points at the system
# library" claim. openssl-src never shows up this way (it is a build-script-only
# dependency, never a compiled object's own crate, per its own `why` below), so it
# is never exempted by this.
crates = ["openssl", "openssl-sys", "openssl-src"]
# Always reported, even when nothing matched: component teams filter on this field.
always_report = true
verdict = "CONDITIONAL"
severity = "high"
family = "library"
why = "OpenSSL. Linking the system copy is the good case because it can pick up the system FIPS provider. A copy shipped inside the wheel cannot, regardless of how OpenSSL itself was built."

[[crypto_library]]
name = "libsodium"
sonames = ["libsodium"]
symbol_group = "libsodium"
string_group = "libsodium"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "NaCl primitives: Curve25519, Ed25519, XSalsa20-Poly1305, BLAKE2b, Argon2. Not a FIPS-validated module and not configurable to become one."

[[crypto_library]]
name = "libgcrypt"
sonames = ["libgcrypt"]
verdict = "CONDITIONAL"
severity = "high"
needs_human_review = true
family = "library"
why = "libgcrypt has a FIPS mode, but only the system copy is built and validated for it. A bundled copy will not honour the system policy."

[[crypto_library]]
name = "nettle"
sonames = ["libnettle", "libhogweed"]
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "Nettle and its public-key half, hogweed. Provides a full primitive set independent of the system provider."

[[crypto_library]]
name = "mbedtls"
sonames = ["libmbedtls", "libmbedcrypto", "libmbedx509"]
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "mbedTLS is a self-contained TLS and crypto stack. It ignores the system crypto policy entirely."

[[crypto_library]]
name = "wolfssl"
sonames = ["libwolfssl", "libwolfcrypt"]
verdict = "NON_APPROVED_CRYPTO"
