# ---------------------------------------------------------------------------
# Dynamic symbol groups.
#
# `prefixes` match the start of a symbol name, `exact` matches the whole name.
# The scanner records whether each match is imported (the symbol is undefined in
# this object, so the code lives elsewhere) or defined (the code is in this object).
# That distinction is what separates "links the system OpenSSL" from "carries its
# own copy", so keep it in mind when adding a group.
#
# Every group here is read by a `dynamic_symbol` rule or by a `[[crypto_library]]`'s
# `symbol_group`, or it carries `evidence_only = true` and its `why` says so. Evidence
# gathered and then read by nothing is a compiled-in primitive that reads
# NO_CRYPTO_DETECTED, and the loader refuses a ruleset that leaves that gap open.
# ---------------------------------------------------------------------------

[[symbol_group]]
name = "openssl"
prefixes = ["EVP_", "SSL_CTX_", "OSSL_PROVIDER_", "OSSL_LIB_CTX_", "X509_STORE_", "PKCS5_PBKDF2_", "RSA_", "EC_KEY_", "BN_"]
exact = ["OPENSSL_init_ssl", "OPENSSL_init_crypto", "RAND_bytes", "RAND_priv_bytes", "ERR_get_error", "SSL_new", "SSL_connect", "HMAC_Init_ex", "HMAC_Final", "BIO_new"]
family = "library"
why = "OpenSSL's public API. Imported means the wheel calls into an OpenSSL it does not ship; defined means it carries OpenSSL code inside the object itself."

[[symbol_group]]
name = "openssl_fips"
prefixes = []
exact = ["EVP_default_properties_is_fips_enabled", "EVP_default_properties_enable_fips", "OSSL_PROVIDER_load", "OSSL_PROVIDER_available", "FIPS_mode", "FIPS_mode_set"]
family = "library"
why = "Symbols that only appear in code that is aware of FIPS mode or of OpenSSL providers. A good sign: it means someone thought about this. Recorded as information, never as a pass."

[[symbol_group]]
name = "libsodium"
prefixes = ["crypto_box_", "crypto_secretbox_", "crypto_sign_", "crypto_aead_", "crypto_generichash_", "crypto_pwhash", "crypto_scalarmult", "crypto_kx_", "sodium_", "randombytes_"]
exact = []
family = "library"
why = "libsodium/NaCl API. Deliberately specific rather than matching every crypto_* name, because that prefix is common in unrelated code."

[[symbol_group]]
name = "boringssl"
prefixes = ["BORINGSSL_", "CRYPTO_BUFFER_", "bssl_"]
exact = ["SSL_CTX_set_grease_enabled", "OPENSSL_is_boringssl"]
family = "library"
why = "BoringSSL is API-similar to OpenSSL but is a separate stack. Google ships a separately validated BoringCrypto build; a wheel bundling BoringSSL is very unlikely to be that build. No rule reads these symbol names: BIN_BORINGSSL reads the same-named string group instead, which the build writes into read-only data. AWS-LC is a BoringSSL fork and keeps BoringSSL-named symbols (see the aws_lc_fips group below), so a rule over this group would report BoringSSL on an AWS-LC object. Recorded as evidence only: the openssl library's fork_symbol_groups reads a defined name from this group only to qualify OpenSSL-named definitions beside it, and alone it raises nothing."
evidence_only = true

[[symbol_group]]
name = "aws_lc"
prefixes = ["AWSLC_", "AWS_LC_", "awslc_"]
exact = ["AWSLC_version_string"]
family = "library"
why = "AWS-LC. A separate FIPS-validated variant exists (aws-lc-fips), so the presence of AWS-LC alone does not tell you which one this is. No rule reads these symbol names: BIN_AWS_LC reads the same-named string group instead, which the build writes into read-only data. Recorded as evidence only: the openssl library's fork_symbol_groups reads a defined name from this group only to qualify OpenSSL-named definitions beside it, and alone it raises nothing."
evidence_only = true

[[symbol_group]]
name = "aws_lc_fips"
prefixes = ["aws_lc_fips_"]
exact = []
family = "library"
why = "The prefix aws-lc-fips-sys gives every AWS-LC symbol it compiles in, aws_lc_fips_<major>_<minor>_<patch>_, where the stock aws-lc-sys build uses aws_lc_<major>_<minor>_<patch>_. Measured on aws-lc-rs 1.18.1: the FIPS build (aws-lc-fips-sys 0.14.2) carries 2118 such names as local definitions in .symtab and the stock build (aws-lc-sys 0.45.0) carries none. Only the Rust crate applies this prefix; a C build of AWS-LC FIPS is unprefixed, and its FIPS-only symbols (BORINGSSL_bcm_text_hash and the like) are shared with BoringSSL's FIPS module; boringssl_fips_module lists the one FIPS-only name upstream exports, BORINGSSL_integrity_test, whose rule names neither fork. A stripped object loses these names, but the aws_lc_fips string group's version string still identifies it."

[[symbol_group]]
name = "boringssl_fips_module"
prefixes = []
exact = ["BORINGSSL_integrity_test"]
family = "library"
why = "Defined only in a FIPS build of the BoringSSL-lineage module, where the power-on self-test calls it. Upstream's header documents it as existing only in FIPS mode without ASAN. Measured as a local definition in Go 1.26.7's BoringCrypto syso and in AWS-LC FIPS's .symtab, and absent from AWS-LC's stock build. It is shared by BoringCrypto and AWS-LC's FIPS module, so it names the module, not the fork. A stripped static object loses it. A shared-library build exports it instead of keeping it local, so it survives as a defined dynamic symbol after stripping removes the local one (source reading: crypto.h declares it OPENSSL_EXPORT; no shared FIPS build was measured)."

[[symbol_group]]
name = "bcrypt_blowfish"
prefixes = ["BF_", "blowfish_", "bcrypt_", "_crypt_blowfish"]
exact = ["crypt_blowfish_rn", "bcrypt_hashpass", "bcrypt_checkpass"]
family = "password_hash"
why = "Blowfish and the bcrypt password hash built on it. Not approved under any configuration."

[[symbol_group]]
name = "blake"
prefixes = ["blake2b_", "blake2s_", "blake2bp_", "blake3_", "BLAKE2"]
exact = []
family = "hash"
why = "BLAKE2 and BLAKE3. Not approved, but very often used for checksums, content addressing and caching rather than for security. BIN_NON_CRYPTO_HASH reads this group beside the same-named string group: a reference implementation compiled in with no banner string carries only these entry points."

[[symbol_group]]
name = "argon2"
prefixes = ["argon2_", "argon2i_", "argon2d_", "argon2id_"]
exact = []
family = "password_hash"
why = "Argon2 entry points, defined in or imported by the object. Argon2 is not an approved key derivation function. BIN_ARGON2 reads this group."

[[symbol_group]]
name = "weak_hash_impl"
prefixes = ["MD4_", "MD5_", "SHA1_", "RIPEMD160_"]
exact = ["md5_init", "md5_update", "md5_final", "sha1_init", "sha1_update", "sha1_final", "MD5Init", "MD5Update", "SHA1Init"]
family = "hash"
why = "MD4, MD5, SHA-1 and RIPEMD-160 entry points. Only meaningful when DEFINED in the wheel's own object: that means the wheel carries its own implementation of a broken hash rather than calling one it can be denied."

[[symbol_group]]
name = "curve25519"
prefixes = ["curve25519_", "x25519_", "ed25519_", "X25519_", "Ed25519_", "ED25519_", "ossl_x25519_", "ossl_ed25519_"]
exact = ["X25519", "ossl_x25519"]
family = "key_agreement"
why = "Every spelling of an X25519/Ed25519 entry point: the generic lowercase names, OpenSSL 1.1.1's X25519/ED25519_*, OpenSSL 3's ossl_x25519*/ossl_ed25519_* provider names, and the internal x25519_fe51_/x25519_fe64_ field-arithmetic helpers OpenSSL 1.1.1 and 3 both define on their assembly paths. OpenSSL's own names are listed on purpose, so a static OpenSSL reads the same on every architecture rather than only where the assembly helpers happen to exist, at the cost that its headline leads with NON_APPROVED_CRYPTO the same way the other legacy primitives already do. None of these OpenSSL names is exported by libcrypto, so a bundled copy matches only when it keeps a .symtab. Status otherwise depends on the standard revision and on validation of the specific implementation, so these always need review rather than an automatic answer."


# ---------------------------------------------------------------------------
# Embedded strings. The scanner extracts printable runs from the binary itself and
# matches them here. Which bytes those runs come from is per format: `binfmt.elf` reads
# the non-executable allocated sections, while Mach-O, PE and the strings-only fallback
# read the whole object, so a match can be a symbol name rather than a banner. A group
# flagged `in_code = true` is also searched for in ELF executable sections, on its own
# separate pass and budget. Substrings are plain text; keep them distinctive enough not
# to match ordinary English.
# ---------------------------------------------------------------------------

[[string_group]]
name = "openssl_banner"
substrings = ["OpenSSL 0.", "OpenSSL 1.", "OpenSSL 2.", "OpenSSL 3.", "OpenSSL 4.", "OpenSSL 5.", "OpenSSL 6.", "OpenSSL 7.", "OpenSSL 8.", "OpenSSL 9."]
family = "library"
why = "OpenSSL's own version banner. The single most reliable way to tell which OpenSSL a binary carries when the symbols are hidden, which is exactly what a statically linked Rust extension does. Every major digit is listed rather than the shipped ones, because a banner this group does not name is a statically linked copy that reads as no OpenSSL at all, and the list going stale is silent: a list that stops at 3 misses cryptography's own PyPI wheels, which compile OpenSSL 4 in. A digit and a dot are still required to keep undotted prose such as \"OpenSSL 3's legacy provider failed to load\" out of the record, but prose naming a dotted version still matches -- \"enable OpenSSL 3.0 legacy provider\" and \"For OpenSSL 3.0.0 and newer\" both do. Linkage counts a banner as a copy only beside an openssl_build_info string, or on an object not read in full; see `DESIGN.md`."

[[string_group]]
name = "openssl_build_info"
substrings = ["OPENSSLDIR: "]
family = "library"
why = "OpenSSL_version() returns the version banner and this string from the same function, so a compiled-in copy that keeps its banner keeps this string beside it. A header supplies the banner macro and never this string, and neither does a sentence that merely names an OpenSSL version. Measured on Fedora 44: the system libcrypto.so.3 and a static PyPI cryptography build both carry it; 15 system-linked Fedora objects carrying an openssl_banner match carry none. cryptography 42.0.5 and 50.0.1 on manylinux, macOS and Windows, and confluent-kafka's bundled librdkafka, all carry it beside their banners too. LibreSSL and BoringSSL define the same prefix in their own OpenSSL_version(). It says nothing on its own -- linkage reads it to tell a header banner or uncorroborated prose from a copy, whether the object imports the library from a dependency it resolved (system or bundled) or has none at all."

[[string_group]]
name = "openssl_fips_provider"
substrings = ["fips=yes", "OSSL_PROVIDER", "fipsmodule.cnf", "FIPS_VERSION"]
family = "library"
why = "Strings from OpenSSL's provider machinery. Suggests FIPS awareness; recorded as information only."

[[string_group]]
name = "boringssl"
substrings = ["BoringSSL", "boringssl"]
family = "library"
why = "BoringSSL identifies itself in read-only data."

[[string_group]]
name = "aws_lc"
substrings = ["AWS-LC", "aws-lc"]
family = "library"
why = "AWS-LC writes its own name into read-only data, which is how we spot it when its symbols are hidden by a version script."

[[string_group]]
name = "aws_lc_fips"
substrings = ["AWS-LC FIPS 0.", "AWS-LC FIPS 1.", "AWS-LC FIPS 2.", "AWS-LC FIPS 3.", "AWS-LC FIPS 4.", "AWS-LC FIPS 5.", "AWS-LC FIPS 6.", "AWS-LC FIPS 7.", "AWS-LC FIPS 8.", "AWS-LC FIPS 9."]
in_code = true
family = "library"
why = "AWS-LC's version string, which a FIPS build spells AWS-LC FIPS <version> and a stock build spells AWS-LC <version>. A digit alone is not enough: the message AWS-LC FIPS failure caused by: is compiled from both builds' source, and a digit with nothing else also matches prose such as AWS-LC FIPS 140-3 validated or AWS-LC FIPS 3's legacy provider failed to load, neither of which names a build. The measured stock build's linker drops the failure message entirely, but a stock build that kept it would carry it outside .text, where this group would still see it, so the digit-and-dot requirement still has to hold. Mirrors openssl_banner: a dot after the digit is required, and every leading digit is listed rather than the majors that shipped, so the list going stale is silent the same way. No AWS-LC FIPS release has a two-digit major yet -- the measured build is 4.2.0 -- so the dot costs nothing today; if one ships, this group needs a further, undotted entry for it. The FIPS build moves the module's constants into .text so its own integrity check covers them, which is exactly where this string lands: measured on aws-lc-fips-sys 0.14.2, AWS-LC FIPS 4.2.0 appears once, in .text, and survives stripping since .text is code, not a symbol table. Readers that scan the whole object, as Mach-O, PE and the fallback do, can see it without any flag; in_code = true is what lets ELF search executable sections for this group too, since binfmt.elf reads only the non-executable allocated sections otherwise. Every other string group in this file stays read-only-data-only. A group should carry in_code only when missing it errs toward over-flagging, the direction this tool accepts: missing this banner leaves a stripped FIPS object reading as the stock build it is not, never the reverse."

[[string_group]]
name = "libsodium"
substrings = ["libsodium", "sodium_init"]
family = "library"
why = "libsodium version and initialisation strings, which survive stripping and catch a statically linked copy."

[[string_group]]
name = "mbedtls"
substrings = ["mbed TLS", "mbedtls_", "Mbed TLS"]
family = "library"
why = "mbedTLS banner and API strings. mbedTLS is usually statically linked, so strings are often the only evidence left."

[[string_group]]
name = "wolfssl"
substrings = ["wolfSSL", "wolfCrypt"]
family = "library"
why = "wolfSSL and wolfCrypt banner strings, present even in stripped static builds."

[[string_group]]
name = "gnutls"
substrings = ["GnuTLS", "gnutls_global_init"]
family = "library"
why = "GnuTLS banner and initialisation strings. GnuTLS is configured separately from OpenSSL, so it needs its own look."

[[string_group]]
name = "nss"
substrings = ["NSS 0.", "NSS 1.", "NSS 2.", "NSS 3.", "NSS 4.", "NSS 5.", "NSS 6.", "NSS 7.", "NSS 8.", "NSS 9.", "softokn3", "NSS_Initialize"]
family = "library"
why = "NSS version and PKCS#11 module strings. NSS keeps its own module database and its own FIPS switch. Every major digit is listed for the reason `openssl_banner` lists them: a version this group does not name is evidence that reads as absent, and the list going stale is silent. NSS has been on 3 since 2000, so this is cheap insurance rather than an expectation."

[[string_group]]
name = "rustls"
substrings = ["rustls", "RUSTLS_"]
family = "tls"
why = "rustls. Its cryptographic provider is a build-time choice (ring or aws-lc-rs), so finding rustls does not by itself say which primitives are in use."

[[string_group]]
name = "blake"
substrings = ["BLAKE2", "BLAKE3", "blake2b", "blake3"]
family = "hash"
why = "BLAKE2 and BLAKE3 markers in read-only data, for the common case where the hash is compiled in rather than linked."

[[string_group]]
name = "go_boring"
substrings = ["crypto/internal/boring", "GOEXPERIMENT=boringcrypto", "boringcrypto"]
family = "library"
why = "A Go binary built with the BoringCrypto backend rather than stock Go crypto."

[[string_group]]
name = "go_fips140"
substrings = ["GOFIPS140=", "fips140=on"]
family = "library"
why = "Build settings a Go binary records in .go.buildinfo when it was built against Go's own FIPS 140-3 module: GOFIPS140 names the module version, and DefaultGODEBUG=fips140=on says the build defaults to enforcing it. Measured on go1.27.1/linux-amd64: a GOFIPS140=v1.0.0 build carries both and a stock build carried neither, while crypto/internal/fips140 package paths appear in both (381 in the stock binary, 334 in the FIPS one) and so cannot tell them apart. GOFIPS140=off records no build setting at all, so an opted-out build reads as the stock build it is. fips140=on is matched without its key on purpose: DefaultGODEBUG is a comma-joined list and fips140 need not be first, so DefaultGODEBUG=fips140=on would stop matching a build that sets any other godebug default beside it. The values GOFIPS140 accepts are not enumerated for the reason openssl_banner does enumerate: latest, inprocess and certified all resolve to different recorded strings, so a list of them is a list that goes stale silently."

[[string_group]]
name = "go_stock_crypto"
substrings = ["crypto/sha256.", "crypto/aes.", "crypto/rsa.", "crypto/ecdsa."]
family = "library"
why = "Stock Go crypto package paths. Go implements its own primitives in Go; they are not the system provider and are not validated."


# ---------------------------------------------------------------------------
# Rust crates, inferred from cargo source paths embedded in the object.
#
# Confidence is medium by nature: the path appears because the crate contributed a
# panic location or similar string, so a crate that contributed no such string can be
# missed. A PEP 770 SBOM, when present, is the higher-confidence source.
#
# An entry's optional `rule` sends that crate's finding to a rule of its own instead of
# to the default rust_crate rule. An entry's optional `suppressed_by` names other
# [[rust_crate]] entries whose finding, on the same object, or in the same SBOM
# document, drops this one.
# ---------------------------------------------------------------------------

[[rust_crate]]
name = "ring"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "ring carries BoringSSL-derived assembly and implements its own primitives. Not a validated module, and it cannot be redirected to the system provider."

[[rust_crate]]
name = "boring-sys"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "Builds BoringSSL and links it into the extension. BoringSSL is not a validated module, does not read the system crypto policy, and its FIPS branch ships separately."

[[rust_crate]]
name = "boring"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
family = "library"
why = "Rust API over BoringSSL, which boring-sys compiles in. Named separately because a binary can carry a panic location from either crate alone."

[[rust_crate]]
name = "aws-lc-sys"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
needs_human_review = true
family = "library"
why = "Statically links AWS-LC into the extension. The separately validated build ships as aws-lc-fips-sys, so this crate name indicates the non-FIPS variant unless proven otherwise."

[[rust_crate]]
name = "aws-lc-rs"
rule = "BIN_AWS_LC_RS_CRATE"
verdict = "NON_APPROVED_CRYPTO"
severity = "high"
needs_human_review = true
family = "library"
why = "Rust API over AWS-LC. It compiles against aws-lc-sys by default and against aws-lc-fips-sys with its fips feature, so this finding does not by itself say which build it compiled against. Its own rule, BIN_AWS_LC_RS_CRATE, names BIN_AWS_LC_FIPS in its rule-level suppressed_by, so an object where the FIPS build is identified, whether by symbol prefix, version string or the aws-lc-fips-sys cargo path, drops this finding and the FIPS build's CONDITIONAL finding stands; no entry-level relation is needed here. An SBOM naming aws-lc-fips-sys in the same document drops this component too, through that same rule relation (crate_suppressors in ruleset.py). An SBOM naming aws-lc-rs beside a FIPS binary object, rather than beside aws-lc-fips-sys in its own SBOM document, keeps this finding: SBOM and binary evidence never suppress each other, because they never share a location path (see Suppression is keyed on rule, subject and object in DESIGN.md)."

[[rust_crate]]
name = "aws-lc-fips-sys"
rule = "BIN_AWS_LC_FIPS"
verdict = "CONDITIONAL"
severity = "medium"
needs_human_review = true
