# Native libraries that Python code may load at runtime through ctypes. Loading
# a crypto library by name sidesteps everything the packaging metadata says.
# ---------------------------------------------------------------------------
[[ctypes_library]]
substrings = ["libcrypto", "libssl", "libsodium", "libgcrypt", "libnettle", "libmbedcrypto",
              "libwolfssl", "libgnutls", "libnss3", "libsoftokn3", "libargon2", "libb2",
              "libcryptopp", "libtomcrypt", "libsecp256k1"]
why = "Any of these names appearing in a ctypes load means crypto is being reached at runtime by name, which no static dependency graph would show."


# ===========================================================================
# RULES
#
# Each rule turns extracted evidence into a finding. `[rule.match]` says what the
# rule looks at; `kind` selects one of the scanner's matchers and everything else
# on that table is data this file controls.
#
# Write `[[rule.match]]` once per alternative, instead of `[rule.match]`, when one
# concern is worth spotting in two ways. The alternatives are ORed under a single rule
# id: two of them that find the same subject still produce one finding, which is what
# splitting the rule in two would lose.
#
# Matcher kinds, and what each looks at:
#   dist_name          the wheel's own canonical project name
#   requires_dist      names in Requires-Dist
#   wheel_generator    the Generator field of .dist-info/WHEEL
#   no_source          the wheel ships .pyc files but no .py sources
#   record_mismatch    RECORD disagrees with the archive contents
#   scan_error         a recorded non-fatal failure of a given kind
#   sbom_component     a component named by a PEP 770 SBOM in the wheel
#   bundled_library    a native library shipped inside the wheel
#   dt_needed          a DT_NEEDED / LC_LOAD_DYLIB dependency
#   dynamic_symbol     a dynamic symbol, filtered by imported vs defined
#   binary_string      a printable string in read-only data
#   rust_crate         a crate inferred from embedded cargo paths
#   linkage            the resolved linkage posture for a named library
#   opaque_binary      a binary that yielded no usable evidence at all
#   partial_binary     a binary in a format we can only read partially
#   py_import          an import statement
#   py_call            a call site, optionally conditioned on its keywords
#   py_attr            an attribute assignment such as check_hostname = False
#   py_constant        a named constant such as ssl.CERT_NONE
#   py_ctypes_load     ctypes.CDLL / cdll.LoadLibrary naming a library
#
# A `linkage` match also takes `sbom_declared` (bool), the wheel-level counterpart to
# `object_values`/`exclude_object_values`: `true` fires only when the wheel's own SBOM
# names the library or a crate that binds it, `false` only when it does not -- except a
# crate name already carried, in its own cargo paths, by an object whose own posture is
# `system`, which does not count: that object already answered `system` on its own
# evidence, so the SBOM restates it rather than naming a second, unaccounted-for copy.
# It combines with either object-value key.
#
# `suppressed_by` drops this rule's finding on an object where one of the named
# rules also fired, so a more specific finding replaces a broader one. It is per
# object (location path), never per wheel: what a rule locates on follows its matcher
# kind, not its layer (a `linkage` match with `object_values` set is per object;
# without it, per wheel). `MATCHER_LOCATIONS` in ruleset.py declares which class of
# path each kind locates on, and the loader refuses a `suppressed_by` between two
# rules that can never share one. `scan_error` and `record_mismatch` locate on
# whatever path the error or mismatch concerns, so they are wildcards and any
# relation naming one is accepted.
#
# A [[rust_crate]] entry can carry its own `suppressed_by`, naming other [[rust_crate]]
# entries, for a relation between two subjects of the same rule. No other table reads
# entry-level `suppressed_by`; the loader refuses it there.
#
# Suppression is non-cascading: what fired is read before anything is dropped, so a
# suppressed suppressor still suppresses. A cycle is refused at load time rather than
# left to silently drop every member of it.
#
# Routing. An entry in [[crypto_distribution]], [[crypto_library]], [[rust_crate]] or
# [[python_module]] can name a `rule`, sending that entry's finding to that rule rather
# than to the table's usual one; a rule can claim every entry of a table that names
# none by setting `default = true` beside its `table`. Exactly one matcher kind per
# table reads either field:
#
#   crypto_distribution   dist_name, requires_dist
#   crypto_library        bundled_library
#   rust_crate            rust_crate
#   python_module         py_import
#
# Other kinds read the same tables and ignore routing entirely. Pointing a `rule` or a
# `default` at one of those is refused at load time: it would look right, load clean,
# and then quietly match nothing.
# ===========================================================================


# --------------------------- Layer 1: metadata -----------------------------

[[rule]]
id = "DIST_NON_APPROVED_CRYPTO"
layer = "metadata"
category = "crypto-implementation"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Distribution implements non-approved cryptography"
why = "The wheel is itself one of the packages known to implement or bundle primitives that are not FIPS-approved. This is a property of the package, not of how it was built, so no build of it changes the answer."
[rule.match]
kind = "dist_name"
table = "crypto_distribution"

[[rule]]
id = "DIST_SYSTEM_CRYPTO_WRAPPER"
layer = "metadata"
category = "crypto-wrapper"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Distribution wraps a system crypto library"
why = "The wheel does not implement crypto itself, it delegates. Whether that is acceptable depends entirely on what it links against, which the binary evidence in the same record answers."
[rule.match]
kind = "dist_name"
table = "crypto_distribution"

[[rule]]
id = "DIST_NON_CRYPTO_HASH"
layer = "metadata"
category = "non-crypto-hash"
severity = "low"
confidence = "high"
verdict = "CONTEXT_DEPENDENT"
needs_human_review = true
title = "Distribution provides a non-cryptographic hash"
why = "Fast hashes used for checksums, caching and feature hashing. Not approved, and usually not doing security work either. Someone has to look at how it is used."
[rule.match]
kind = "dist_name"
table = "crypto_distribution"

[[rule]]
id = "DIST_BUNDLED_TRUST_STORE"
layer = "metadata"
category = "trust-policy"
severity = "low"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Distribution ships its own CA trust store"
family = "trust_store"
why = "Not a crypto implementation, but code that uses a bundled CA bundle stops following the system trust policy and stops picking up system trust updates."
[rule.match]
kind = "dist_name"
table = "crypto_distribution"

[[rule]]
id = "DIST_DEPENDS_ON_CRYPTO"
layer = "metadata"
category = "dependency"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Depends on a crypto distribution"
why = "Records the dependency edge so the index can be walked. The dependency carries its own risk and gets its own record; this finding deliberately contributes no verdict so that risk is not double-counted."
[rule.match]
kind = "requires_dist"
table = "crypto_distribution"
any_entry = true

[[rule]]
id = "WHEEL_GENERATOR"
layer = "metadata"
category = "build-provenance"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Wheel build tool"
why = "Which tool produced the wheel. maturin means Rust and therefore probable static linking; auditwheel-repaired wheels carry vendored libraries. Provenance only, never a risk by itself."
[rule.match]
kind = "wheel_generator"

[[rule]]
id = "WHEEL_NO_PYTHON_SOURCE"
layer = "metadata"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Wheel ships Python that could not be read"
why = "Either the wheel ships bytecode with no source, or every source file it does ship failed to parse. Either way Layer 3 had nothing to work with, so the absence of Python findings means nothing. Explicitly opaque rather than quietly clean."
[rule.match]
kind = "no_source"

[[rule]]
id = "WHEEL_METADATA_UNPARSEABLE"
layer = "metadata"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Wheel metadata missing or unreadable"
why = "Without METADATA or WHEEL we cannot identify the distribution, so none of the name-based rules can be trusted for this wheel."
[rule.match]
kind = "scan_error"
error_kinds = [
    "metadata_missing",
    "metadata_decode_error",
    "wheel_missing",
    "dist_info_missing",
    "dist_info_ambiguous",
]

[[rule]]
id = "WHEEL_UNREADABLE"
layer = "metadata"
category = "opacity"
severity = "high"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Wheel could not be opened"
why = "Not a readable zip at all, so nothing in it was examined. This has to be a finding: a wheel that produced no evidence because we could not open it must never be reported the same way as a wheel that produced no evidence because there was none."
[rule.match]
kind = "scan_error"
error_kinds = ["bad_zip"]

[[rule]]
id = "WHEEL_SCAN_INTERRUPTED"
layer = "metadata"
category = "opacity"
severity = "high"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Wheel scan was interrupted"
why = "An exception the scanner did not specifically anticipate cut the read short before anything else ran -- unlike WHEEL_UNREADABLE this makes no claim about the archive's own bytes, so it must not be reported as a corrupt zip. The same wheel can read cleanly on a later attempt once whatever interrupted this one (memory pressure, a transient I/O error) has passed, which is also why a record carrying this kind is never cached: see DESIGN.md."
[rule.match]
kind = "scan_error"
error_kinds = ["unexpected_error"]

[[rule]]
id = "WHEEL_MEMBER_UNREADABLE"
layer = "metadata"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Part of the wheel could not be read"
why = "A member was unreadable, too large, or expanded far enough to look like a zip bomb, so it was skipped. Whatever was inside it is unexamined rather than absent."
[rule.match]
kind = "scan_error"
error_kinds = ["member_read_error", "size_limit_exceeded", "compression_ratio_exceeded"]

[[rule]]
id = "WHEEL_ARCHIVE_ANOMALY"
layer = "metadata"
category = "integrity"
severity = "info"
confidence = "high"
needs_human_review = true
title = "Archive structure is unusual"
why = "A duplicated member name, or a filename that is not a valid wheel name. Usually a repair tool being sloppy, occasionally worth asking about, never on its own a crypto finding."
[rule.match]
kind = "scan_error"
error_kinds = ["duplicate_member", "wheel_filename_invalid"]

[[rule]]
id = "WHEEL_RECORD_UNREADABLE"
layer = "metadata"
category = "integrity"
severity = "info"
confidence = "high"
needs_human_review = false
title = "RECORD missing or unparseable"
why = "Without RECORD the file inventory cannot be reconciled against the archive. Informational: it says we did one fewer cross-check, not that anything is wrong."
[rule.match]
kind = "scan_error"
error_kinds = ["record_missing", "record_parse_error"]

[[rule]]
id = "SBOM_UNREADABLE"
layer = "metadata"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Shipped SBOM could not be parsed"
why = "The wheel ships an SBOM, which is the highest-confidence statement we can get about what it bundles, and we could not read it. Marked opaque rather than ignored, because the one file that would have told us what is vendored is the file that failed."
[rule.match]
kind = "scan_error"
error_kinds = ["sbom_parse_error"]

[[rule]]
id = "WHEEL_RECORD_MISMATCH"
layer = "metadata"
category = "integrity"
severity = "info"
confidence = "medium"
needs_human_review = true
title = "RECORD does not match archive contents"
why = "Files present in the archive but absent from RECORD, or the reverse. Usually a repair tool that did not update RECORD, occasionally something worth asking about."
[rule.match]
kind = "record_mismatch"

[[rule]]
id = "WHEEL_BINARIES_TRUNCATED"
layer = "metadata"
category = "integrity"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Not every native object is listed in the record"
why = "The wheel has more native objects than max_binaries_per_record, so binaries[] and artifacts.extensions do not list all of them. This is not a gap in the evidence: every object that became part of this record's binary evidence ran through every rule above, so the verdict already reflects everything evaluated -- not that each one was read in full (partial_analysis says that, per object) or that every archive member got this far (one refused by a limit is in artifacts.skipped; one that failed to open or read is an error). The objects any finding above names are kept first; what is missing is only some of the rest of the per-object listing a human would read back out of the JSON, and this says so rather than leaving artifacts.binaries_truncated as the only trace."
[rule.match]
kind = "binaries_truncated"

[[rule]]
id = "SBOM_CRYPTO_COMPONENT"
layer = "metadata"
category = "bundled-crypto"
severity = "high"
confidence = "high"
needs_human_review = true
title = "PEP 770 SBOM declares a bundled crypto component"
why = "The wheel states in its own SBOM which libraries and crates it carries. This is the highest-confidence bundled-dependency evidence available, because the build tool wrote it rather than us inferring it. A crate component is dropped beside another component of the same SBOM document whose finding would drop it on a binary object, the same relation the rust_crate matcher reads."
[rule.match]
kind = "sbom_component"
tables = ["crypto_library", "rust_crate", "crypto_distribution"]


# ------------------------ Layer 2: native binaries -------------------------

[[rule]]
id = "BIN_BUNDLED_OPENSSL"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Wheel ships its own OpenSSL"
why = "The single most valuable check in this tool. A libcrypto or libssl copied into the wheel by auditwheel or delocate cannot see the system FIPS provider, cannot see the system crypto policy, and will not be updated when the system OpenSSL is. The condition for approval does not hold for this build."
[rule.match]
kind = "bundled_library"
library = "openssl"

[[rule]]
id = "BIN_BUNDLED_CRYPTO_LIB"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
needs_human_review = true
title = "Wheel ships its own crypto library"
why = "Any crypto library carried inside the wheel runs outside the system crypto policy. The class comes from the library's own entry in the crypto_library table."
[rule.match]
kind = "bundled_library"
table = "crypto_library"
exclude_libraries = ["openssl"]

[[rule]]
id = "BIN_NEEDED_SYSTEM_OPENSSL"
layer = "binary"
category = "system-crypto-link"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Links the system OpenSSL"
why = "A plain, unmangled libcrypto.so.3 or libssl.so.3 dependency that does not resolve to a copy the wheel itself ships (delocate vendors without renaming, so an unmangled name alone is not enough). This is the good case: the extension resolves to whatever OpenSSL the host provides, so a FIPS-enabled host gives it the FIPS provider. Recorded as information; the wheel is still CONDITIONAL, and the condition is what the linkage field reports."
[rule.match]
kind = "dt_needed"
library = "openssl"
mangled = false

[[rule]]
id = "BIN_NEEDED_MANGLED_CRYPTO"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Depends on a hash-renamed crypto library"
why = "A dependency such as libcrypto-3a1f2b4c.so.3, or libcrypto-3-x64-a1b2c3d4.dll on Windows, is a vendored copy: auditwheel, delocate and delvewheel rename libraries they bundle so they cannot collide with the system ones. Seeing this name means the wheel binds to its own copy even if the vendor directory itself is not where we expected."
[rule.match]
kind = "dt_needed"
table = "crypto_library"
mangled = true

[[rule]]
id = "BIN_NEEDED_VENDORED_CRYPTO"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Depends on a crypto library the wheel ships under its own name"
why = "delocate copies a dependency into .dylibs/ and rewrites the load command to point there without renaming the file, so a plain, unmangled needed entry can still resolve to an object this wheel itself ships -- and nothing stops a Linux build placing an unmangled dependency beside the extension the same way. BIN_NEEDED_MANGLED_CRYPTO only catches a hash-renamed name; this is the rule that says a needed entry is bundled when it resolves to a shipped object without one, so that reading of bundled is never silent."
[rule.match]
kind = "dt_needed"
table = "crypto_library"
resolved = true

[[rule]]
id = "BIN_OPENSSL_SYMBOLS_IMPORTED"
layer = "binary"
category = "system-crypto-link"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Imports OpenSSL symbols"
why = "Undefined OpenSSL symbols mean the code calls an OpenSSL it does not contain. Combined with a system DT_NEEDED entry this is the posture we want."
[rule.match]
kind = "dynamic_symbol"
group = "openssl"
binding = "imported"

[[rule]]
id = "BIN_OPENSSL_SYMBOLS_DEFINED"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Defines OpenSSL symbols"
why = "OpenSSL entry points defined inside the wheel's own object mean OpenSSL was compiled into it. Statically linked crypto answers to no system policy and cannot be swapped for the FIPS provider."
[rule.match]
kind = "dynamic_symbol"
group = "openssl"
binding = "defined"

[[rule]]
id = "BIN_OPENSSL_BANNER"
layer = "binary"
category = "bundled-crypto"
severity = "medium"
confidence = "medium"
needs_human_review = true
title = "Contains an OpenSSL version banner"
why = "OpenSSL writes its version string into read-only data. Finding it inside a wheel's own extension is how we catch a statically linked OpenSSL whose symbols were hidden by a version script, which is exactly what a Rust extension built with vendored openssl-sys looks like. A banner in an object that imports its OpenSSL from a system dependency or from the bundled copy it depends on, and carries none of the build strings a compiled copy keeps beside it, is header text; on an object with no dependency on the library at all and none of those build strings, the banner is uncorroborated prose rather than a confirmed copy. Either way the linkage posture reads it that way."
[rule.match]
kind = "binary_string"
group = "openssl_banner"

[[rule]]
id = "BIN_STATIC_OPENSSL"
layer = "binary"
category = "bundled-crypto"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "OpenSSL statically linked into an extension"
why = "No OpenSSL dependency is declared and no vendor directory exists, yet the extension contains OpenSSL code. This is the case a vendor-directory check alone would miss, and it is the least visible way to end up outside the system FIPS provider."
[rule.match]
kind = "linkage"
name = "openssl"
value = "static"

[[rule]]
id = "DERIVED_SYSTEM_OPENSSL_ONLY"
layer = "derived"
category = "system-crypto-link"
severity = "info"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "All OpenSSL use resolves to the system library"
why = "Every piece of OpenSSL evidence in this wheel points at the system library and none at a bundled or static copy. This is the condition under which a CONDITIONAL wheel is acceptable, so the record states it explicitly rather than leaving it to be inferred from the absence of other findings. It is withheld in two cases: when some object in the wheel uses OpenSSL without saying which copy (its own posture is unknown: imported symbols with no declared dependency, a Rust crate that binds it and nothing else, a vendor-shaped dependency the wheel could not confirm, an OpenSSL-named definition beside AWS-LC or BoringSSL, which define the same names, or an uncorroborated version banner), or when the wheel's own SBOM names OpenSSL or a crate that binds it and no system-linked object's own cargo paths already carry that same crate. Either way not every piece of evidence points at the system library, even though the linkage field, where unknown never outvotes a definite posture, still reads system. A system-linked object naming its own openssl-sys is the ordinary shape of a system-linked Rust build, not a second, unaccounted-for copy, so an SBOM component that only restates it does not withhold this finding."
[rule.match]
kind = "linkage"
name = "openssl"
value = "system"
exclude_object_values = ["unknown"]
sbom_declared = false

[[rule]]
id = "DERIVED_OPENSSL_UNRESOLVED_BESIDE_SYSTEM"
layer = "derived"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "An object uses OpenSSL without saying which copy, beside a system-linked one"
why = "The wheel's OpenSSL linkage resolved to system from another object, but this object uses OpenSSL -- imported symbols with no declared dependency, a Rust crate that binds it and nothing else, a vendor-shaped dependency the wheel could not confirm, an OpenSSL-named definition beside AWS-LC or BoringSSL, which define the same names, or an uncorroborated version banner -- and says nothing about which copy. The linkage field still reads system, because unknown never outvotes a definite posture, so this finding is what keeps the record from stating that all OpenSSL use resolves to the system library, and what gives the wheel a class when DERIVED_SYSTEM_OPENSSL_ONLY is withheld. A crate-only object is more likely a static copy than a system one, since a dynamically linked openssl-sys leaves a dependency and imports."
[rule.match]
kind = "linkage"
name = "openssl"
value = "system"
object_values = ["unknown"]

[[rule]]
id = "DERIVED_OPENSSL_DECLARED_BESIDE_SYSTEM"
layer = "derived"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "The wheel's SBOM names OpenSSL or a crate that binds it, beside a system-linked object it does not account for"
why = "The field resolved to system from an object's own evidence, but the wheel's own SBOM names OpenSSL or a crate that binds it -- openssl-src is the vendored build -- and no system-linked object's own cargo paths already carry that same crate. A component names a package, not the object it was compiled into, so unless the very object that reads system is the one carrying it, the record cannot say every OpenSSL use resolves to the system library. This finding keeps that claim off the record, and SBOM_CRYPTO_COMPONENT names the component itself. openssl-src never carries this exemption: it is a build-script-only dependency that never shows up in a compiled object's own cargo paths, so it always costs the claim."
[rule.match]
kind = "linkage"
name = "openssl"
value = "system"
sbom_declared = true

[[rule]]
id = "BIN_LINKED_CRYPTO_LIBRARY"
layer = "binary"
category = "crypto-linkage"
severity = "high"
confidence = "high"
needs_human_review = true
title = "Uses a crypto library other than OpenSSL"
why = "A crypto library was resolved to a system, bundled or statically linked copy. Without this rule the linkage would be reported in verdict.conditions while the verdict class said nothing was found, which is the one thing a headline field must never do. The class comes from the library's own entry in the crypto_library table."
[rule.match]
kind = "linkage"
table = "crypto_library"
# OpenSSL has its own rules above, which carry more specific wording per posture.
exclude_libraries = ["openssl"]
values = ["system", "bundled", "static", "mixed"]

[[rule]]
id = "BIN_OPENSSL_LINKAGE_UNKNOWN"
layer = "binary"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "OpenSSL is used but the linkage could not be resolved"
why = "The wheel uses OpenSSL without saying which copy: imported symbols with no declared dependency, a crate that binds it, or the wheel's own SBOM naming it or such a crate, with no object in the wheel answering definitely; an OpenSSL-named definition in an object that also carries AWS-LC or BoringSSL, which define the same names; an OpenSSL version banner with none of the build strings a compiled-in copy keeps beside it; or OpenSSL is found both linked and carried, in one object or across objects, which reads `mixed`; or the only evidence came from an object we could not read. This wheel's own record cannot say which copy answers for it, so it is opaque rather than nothing found."
[rule.match]
kind = "linkage"
name = "openssl"
values = ["unknown", "mixed"]

[[rule]]
id = "BIN_FIPS_PROVIDER_AWARE"
layer = "binary"
category = "fips-aware"
severity = "info"
confidence = "medium"
needs_human_review = false
title = "Code is aware of OpenSSL providers or FIPS mode"
why = "The binary references provider or FIPS-mode APIs, so someone wrote code that at least knows FIPS mode exists. A positive signal for a reviewer. It is not a pass and never contributes a verdict."
[rule.match]
kind = "dynamic_symbol"
group = "openssl_fips"
binding = "any"

[[rule]]
id = "BIN_LIBSODIUM"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "libsodium primitives present"
why = "NaCl primitives compiled into or shipped with the wheel. There is no system-policy path that makes them approved."
[rule.match]
kind = "dynamic_symbol"
group = "libsodium"
binding = "any"

[[rule]]
id = "BIN_BORINGSSL"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "BoringSSL present"
why = "BoringSSL is a separate stack from OpenSSL and ignores the system crypto policy. A separately validated BoringCrypto build exists, so a reviewer has to determine which build this is rather than assuming the worst or the best. Suppressed on an object where the FIPS module's integrity test or a Go BoringCrypto build is identified, because both carry BoringSSL's own strings in read-only data; a stock BoringSSL object elsewhere in the wheel keeps its own finding."
suppressed_by = ["BIN_BORINGSSL_FIPS_MODULE", "BIN_GO_BORING_CRYPTO"]
[rule.match]
kind = "binary_string"
group = "boringssl"

[[rule]]
id = "BIN_BORINGSSL_FIPS_MODULE"
layer = "binary"
category = "bundled-crypto"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "BoringSSL-lineage FIPS module present"
why = "The FIPS module's power-on integrity test is compiled in. The symbol is shared by BoringCrypto and AWS-LC FIPS, so it identifies a FIPS build of the BoringSSL-lineage module, not which fork compiled it; the fork itself is still named by BIN_BORINGSSL's or BIN_AWS_LC's own strings. It is a condition, not a pass: the module is a static copy, and which validated version was compiled in is not something the wheel states. Suppresses BIN_BORINGSSL on the same object only, so a FIPS-built binary does not hide a stock one beside it in the wheel; a stripped static object loses this symbol along with everything else that would tell it apart and reads as stock BoringSSL."
[rule.match]
kind = "dynamic_symbol"
group = "boringssl_fips_module"
binding = "defined"

[[rule]]
id = "BIN_AWS_LC"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "AWS-LC present"
why = "AWS-LC statically linked into the wheel. A FIPS variant of AWS-LC exists and is a different build, so confirm which one before concluding. Suppressed on an object where the FIPS build is also identified, because the aws_lc substrings match both builds, and lowercase aws-lc also matches the cargo path of either crate; a stock AWS-LC object elsewhere in the same wheel keeps this finding."
suppressed_by = ["BIN_AWS_LC_FIPS"]
[rule.match]
kind = "binary_string"
group = "aws_lc"

[[rule]]
id = "BIN_AWS_LC_FIPS"
layer = "binary"
category = "bundled-crypto"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "AWS-LC FIPS build present"
why = "The FIPS build of AWS-LC, identified by its version string, by the symbol prefix aws-lc-fips-sys applies, or by that crate's cargo path. A condition rather than an answer: it is still a static copy bundled into the wheel rather than the system provider, and which validated version was compiled in is not something the wheel states. The version string survives stripping -- it lives in .text, not .symtab, and ELF searches executable sections for this group alone -- so a stripped ELF object is still identified by it even once the symbol prefix is gone. Suppresses BIN_AWS_LC and BIN_AWS_LC_RS_CRATE on the same object only, so a wheel shipping one FIPS object and one stock one keeps the stock object's own finding; the per-object evidence stays in matched_symbols and matched_strings."
[[rule.match]]
kind = "binary_string"
group = "aws_lc_fips"

[[rule.match]]
kind = "dynamic_symbol"
group = "aws_lc_fips"
binding = "any"

[[rule.match]]
kind = "rust_crate"
table = "rust_crate"

[[rule]]
id = "BIN_AWS_LC_RS_CRATE"
layer = "binary"
category = "rust-crate"
severity = "high"
confidence = "medium"
needs_human_review = true
title = "aws-lc-rs compiled in"
why = "Inferred from the aws-lc-rs cargo path, which both AWS-LC builds carry. The crate's own entry supplies the class. It has its own rule, rather than the default crate rule, so that it can be suppressed when the FIPS build is identified: measured on aws-lc-rs 1.18.1, a FIPS build carries this path and no aws-lc-fips-sys path, so without the suppression a validated build reads as non-approved through this crate alone."
suppressed_by = ["BIN_AWS_LC_FIPS"]
[rule.match]
kind = "rust_crate"
table = "rust_crate"

[[rule]]
id = "BIN_BCRYPT_BLOWFISH"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Blowfish or bcrypt implementation present"
why = "Defined, not imported, so Blowfish-based password hashing is compiled into the wheel. Not approved under any configuration. A statically linked or bundled OpenSSL defines this entry point too, so beside BIN_STATIC_OPENSSL and BIN_BUNDLED_OPENSSL this can be OpenSSL's own legacy code: still carried by the wheel and still out of reach of the host FIPS provider. verdict.conditions.openssl_linkage says whether the wheel carries its own OpenSSL at all, not which case this is, and not when a wheel carries both -- the object's own matched_symbols is what tells them apart. An object that only imports these names is BIN_BCRYPT_BLOWFISH_IMPORTED."
[rule.match]
kind = "dynamic_symbol"
group = "bcrypt_blowfish"
binding = "defined"

[[rule]]
id = "BIN_BCRYPT_BLOWFISH_IMPORTED"
layer = "binary"
category = "non-approved-call"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Calls Blowfish or bcrypt from a linked library"
why = "The object calls Blowfish or bcrypt that lives in a library it links, and does not carry the code itself. Blowfish is not approved under any configuration, so this is never a pass. It is CONDITIONAL rather than NON_APPROVED_CRYPTO because the wheel neither implements nor bundles the primitive: whichever library answers the call governs it, and verdict.conditions.openssl_linkage says whether that is the host's libcrypto. OpenSSL's low-level BF_ functions sit outside its provider mechanism, so a FIPS-enforcing host does not refuse them the way it refuses a Blowfish fetched through EVP; a reviewer has to read what the call is for. A bundled libcrypto that answers the call defines these names itself and carries BIN_BCRYPT_BLOWFISH on its own object."
[rule.match]
kind = "dynamic_symbol"
group = "bcrypt_blowfish"
binding = "imported"

[[rule]]
id = "BIN_ARGON2"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Argon2 implementation present"
why = "Defined means an Argon2 implementation is compiled into the object; imported means it calls an Argon2 library at run time. Argon2 is not an approved key derivation function. The host OpenSSL exports no such name -- its own Argon2 is only reachable through EVP_KDF -- so an import here is never a call into the host FIPS provider, unlike a Blowfish import, which the system libcrypto does export. A dependency on libargon2 is also reported by BIN_LINKED_CRYPTO_LIBRARY."
[rule.match]
kind = "dynamic_symbol"
group = "argon2"
binding = "any"

[[rule]]
id = "BIN_OWN_WEAK_HASH_IMPL"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "medium"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Ships its own MD4/MD5/SHA-1 implementation"
why = "Defined, not imported, so the wheel carries the code itself. That matters more than it first appears: a private implementation of a broken hash cannot be refused by FIPS mode the way hashlib can, so it will keep working silently on a FIPS-enforcing host. A statically linked or bundled OpenSSL defines these entry points too, so beside BIN_STATIC_OPENSSL and BIN_BUNDLED_OPENSSL this can be OpenSSL's own legacy-provider code: still carried by the wheel and still out of reach of the host FIPS provider. verdict.conditions.openssl_linkage says whether the wheel carries its own OpenSSL at all, not which case this is, and not when a wheel carries both -- the object's own matched_symbols is what tells them apart. A statically linked AWS-LC defines them too, its FIPS build included: the FIPS module links as one monolithic object, so an unstripped FIPS build defines md5_final beside its aws_lc_fips_-prefixed entry points. BIN_AWS_LC_FIPS does not suppress this finding, because the module still offers the primitive and does not refuse it, and deciding the object is acceptable on balance is a reviewer's call; its CONDITIONAL stays in verdict.classes alongside."
[rule.match]
kind = "dynamic_symbol"
group = "weak_hash_impl"
binding = "defined"

[[rule]]
id = "BIN_ALT_TLS_STACK"
layer = "binary"
category = "alt-tls-stack"
severity = "high"
confidence = "high"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Alternative TLS stack present"
why = "mbedTLS, wolfSSL or rustls compiled in. Each is a complete TLS implementation that does not consult the system crypto policy, so the host's FIPS configuration has no effect on it."
[rule.match]
kind = "binary_string"
groups = ["mbedtls", "wolfssl", "rustls"]

[[rule]]
id = "BIN_NSS_OR_GNUTLS"
layer = "binary"
category = "alt-tls-stack"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "NSS or GnuTLS present"
why = "Both have FIPS modes in their system builds, and both are configured separately from OpenSSL. Whether FIPS applies depends on which copy is loaded and how it is configured."
[rule.match]
kind = "binary_string"
groups = ["nss", "gnutls"]

[[rule]]
id = "BIN_NON_CRYPTO_HASH"
layer = "binary"
category = "non-crypto-hash"
severity = "low"
confidence = "medium"
verdict = "CONTEXT_DEPENDENT"
needs_human_review = true
title = "BLAKE family hash present"
why = "Not approved, but commonly used for content addressing, deduplication and caching rather than for security. Worth a glance, rarely worth a change. Fires on a BLAKE2/BLAKE3 marker in read-only data or on a BLAKE entry point in the object's symbols: a reference implementation compiled in with no marker string carries only its blake2b_init-style names."
[[rule.match]]
kind = "binary_string"
group = "blake"

[[rule.match]]
kind = "dynamic_symbol"
group = "blake"
binding = "any"

[[rule]]
id = "BIN_CURVE25519"
layer = "binary"
category = "non-approved-impl"
severity = "high"
confidence = "medium"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Curve25519 family implementation present"
why = "X25519 and Ed25519 entry points compiled in. Their standing depends on the standard revision and on validation of the specific implementation, so this always goes to a human rather than being answered here. A statically linked or bundled OpenSSL defines some of these entry points too: OpenSSL 3's ossl_x25519/ossl_ed25519_* provider names, 1.1.1's X25519/ED25519_*, and both versions' internal x25519_fe51_/x25519_fe64_ field-arithmetic helpers, so beside BIN_STATIC_OPENSSL and BIN_BUNDLED_OPENSSL this can be OpenSSL's own internal code rather than something the wheel wrote: still carried by the wheel and still out of reach of the host FIPS provider. verdict.conditions.openssl_linkage says whether the wheel carries its own OpenSSL at all, not which case this is, and not when a wheel carries both -- the object's own matched_symbols is what tells them apart. A statically linked AWS-LC defines curve25519_x25519 too, its FIPS build included: s2n-bignum's X25519 implementation compiles into the FIPS module, so an unstripped FIPS build defines it beside the module's aws_lc_fips_-prefixed entry points. BIN_AWS_LC_FIPS does not suppress this finding either, for the same reason: the module still offers the primitive and does not refuse it, and deciding the object is acceptable on balance is a reviewer's call."
[rule.match]
kind = "dynamic_symbol"
group = "curve25519"
binding = "defined"

[[rule]]
id = "BIN_RUST_CRYPTO_CRATE"
layer = "binary"
category = "rust-crate"
severity = "high"
confidence = "medium"
needs_human_review = true
title = "Rust crypto crate compiled in"
why = "Inferred from cargo source paths the compiler embedded in the object. Confidence is medium because a crate that contributed no such string can be missed; a PEP 770 SBOM, where present, is the better source. The class comes from the crate's own entry in the rust_crate table."
[rule.match]
kind = "rust_crate"
table = "rust_crate"
default = true

[[rule]]
id = "BIN_GO_BORING_CRYPTO"
layer = "binary"
category = "go-crypto"
severity = "medium"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Go binary built with BoringCrypto"
family = "library"
why = "Go's BoringCrypto backend replaces the stock Go implementations with a separately validated module. Which validated version was used is a property of the toolchain, not of this wheel, so a reviewer has to confirm it."
[rule.match]
kind = "binary_string"
group = "go_boring"

[[rule]]
id = "BIN_GO_FIPS140"
layer = "binary"
category = "go-crypto"
severity = "medium"
confidence = "medium"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Go binary built against the Go FIPS 140-3 module"
family = "library"
why = "Since Go 1.24 the standard library routes its crypto through crypto/internal/fips140, and a build with GOFIPS140 set compiles the validated module in and defaults GODEBUG to fips140=on. That is a condition rather than an answer: the module is in force only if the deployment does not turn GODEBUG back off, and which validated version was compiled in is a property of the toolchain this wheel does not state. Matched on the build settings rather than on the package paths, which a stock build carries too."
[rule.match]
kind = "binary_string"
group = "go_fips140"

[[rule]]
id = "BIN_GO_STOCK_CRYPTO"
layer = "binary"
category = "go-crypto"
severity = "high"
confidence = "medium"
verdict = "NON_APPROVED_CRYPTO"
needs_human_review = true
title = "Go binary using stock Go crypto"
family = "library"
why = "Go implements its primitives in Go. They are not the system provider and are not a validated module, and nothing on the host can redirect them. Suppressed when BoringCrypto or the Go FIPS 140-3 module is detected, because both builds still contain the stock package paths: measured on go1.27.1, a GOFIPS140 build carries crypto/sha256. and crypto/aes. exactly as often as a stock one, so without the suppression a binary whose crypto goes through the validated module would read as non-approved. Suppression is per object, so a wheel shipping one FIPS-built and one stock Go binary reports both, with the stock finding located on the stock object alone."
suppressed_by = ["BIN_GO_BORING_CRYPTO", "BIN_GO_FIPS140"]
[rule.match]
kind = "binary_string"
group = "go_stock_crypto"

[[rule]]
id = "BIN_OPAQUE"
layer = "binary"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Binary yielded no usable evidence"
why = "No dependencies, no dynamic symbols, no readable strings. We learned nothing from this object, which is a finding rather than a pass. Do not read the absence of crypto findings on this wheel as absence of crypto."
[rule.match]
kind = "opaque_binary"

[[rule]]
id = "BIN_PARTIAL_FORMAT"
layer = "binary"
category = "opacity"
severity = "low"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Binary format only partially readable"
why = "Part of this object was not read, so some dependency or symbol evidence is missing for it, and the object's partial_reasons names which causes applied. Recorded so a wheel can never look clean merely because we read less of it. Only an ordinal import is handled by BIN_PARTIAL_ROUTINE instead; everything else lands here, including an ordinal export and any cause added later."
[rule.match]
kind = "partial_binary"
exclude_reasons = ["pe_ordinal_import"]

[[rule]]
id = "BIN_PARTIAL_ROUTINE"
layer = "binary"
category = "opacity"
severity = "info"
confidence = "high"
needs_human_review = false
title = "Binary declares something this tool cannot name, by design"
why = "This object was not read in full, but the cause is a convention rather than a failure: an import bound by ordinal has no function name to match. WS2_32 is normally bound by ordinal, so this is the ordinary shape of a Windows extension that touches sockets, and treating it as opacity would put every such wheel on the OPAQUE triage list. What is lost is a function name inside a DLL the record still names, so a crypto dependency bound this way is still caught by its DT_NEEDED equivalent. A forwarder whose target is named by ordinal -- `SOMEDLL.#123` -- is the same shape: the loader opens the DLL before it can fail to find the ordinal inside, so the dependency survives in needed the same way, and this cause is reused rather than given a token of its own. Recorded without a verdict: the evidence really is incomplete, so the record says so, but it is not on its own a reason for a human to look. An ordinal export is not this: it names a definition rather than a dependency, so BIN_PARTIAL_FORMAT claims it."
[rule.match]
kind = "partial_binary"
reasons = ["pe_ordinal_import"]

[[rule]]
id = "BIN_UNPARSEABLE"
layer = "binary"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Binary could not be parsed"
why = "Truncated, corrupt or an unrecognised format. Same reasoning as an opaque binary: we cannot see inside it, so we say so."
[rule.match]
kind = "scan_error"
error_kinds = ["elf_parse_error", "macho_parse_error", "pe_parse_error", "ar_parse_error", "binary_truncated", "binary_unknown_format"]

[[rule]]
id = "BIN_TOO_LARGE"
layer = "binary"
category = "opacity"
severity = "medium"
confidence = "high"
verdict = "OPAQUE"
needs_human_review = true
title = "Binary exceeded the size limit and was not analysed"
why = "Skipped to bound memory. Raise --max-binary-bytes and rescan if this matters; until then the object is unexamined, not clean."
[rule.match]
kind = "scan_error"
error_kinds = ["binary_too_large"]


# ------------------------- Layer 3: Python source --------------------------

[[rule]]
id = "PY_IMPORT_CRYPTO_MODULE"
layer = "python"
category = "python-import"
severity = "low"
confidence = "high"
needs_human_review = true
title = "Imports a crypto module"
why = "Which crypto surface the code reaches for. An import is not proof of use, but it bounds what the package could possibly be doing. Severity and class come from the module's entry in the python_module table."
[rule.match]
kind = "py_import"
table = "python_module"
default = true

[[rule]]
id = "PY_INSECURE_RNG"
layer = "python"
category = "rng"
severity = "low"
confidence = "low"
verdict = "CONTEXT_DEPENDENT"
needs_human_review = true
title = "Imports the non-cryptographic random module"
family = "drbg"
why = "random is a Mersenne Twister, fine for sampling and wrong for keys, tokens, nonces or salts. Very common and usually benign, so it is low confidence on purpose: a reviewer decides, the tool only points."
[rule.match]
kind = "py_import"
table = "python_module"

[[rule]]
id = "PY_WEAK_HASH_CALL"
layer = "python"
category = "fips-breaking"
severity = "high"
confidence = "high"
verdict = "FIPS_BREAKING"
needs_human_review = true
title = "Weak hash called without usedforsecurity=False"
family = "hash"
why = "hashlib.md5() and hashlib.sha1() raise on a FIPS-enforcing host unless the caller passes usedforsecurity=False. This is the finding that predicts a runtime crash rather than a policy discussion, and the fix is usually one keyword argument. An explicit usedforsecurity=True is the same outcome, and at least as confident: the caller is not silent about intent, it is declaring one."
[rule.match]
kind = "py_call"
targets = ["hashlib.md5", "hashlib.sha1", "hashlib.new"]
algorithm_list = "weak"
usedforsecurity = ["absent", "true"]

[[rule]]
id = "PY_WEAK_HASH_CALL_MARKED"
layer = "python"
category = "fips-annotated"
severity = "low"
confidence = "high"
verdict = "CONTEXT_DEPENDENT"
needs_human_review = true
title = "Weak hash called with usedforsecurity=False"
family = "hash"
why = "The caller declared this is not a security use, so it will keep working on a FIPS-enforcing host. Degraded severity rather than cleared: the declaration is an assertion by the author, and someone should agree with it."
[rule.match]
kind = "py_call"
targets = ["hashlib.md5", "hashlib.sha1", "hashlib.new"]
algorithm_list = "weak"
usedforsecurity = "false"

[[rule]]
id = "PY_WEAK_HASH_UNRESOLVED"
layer = "python"
category = "fips-breaking"
severity = "medium"
confidence = "low"
verdict = "CONTEXT_DEPENDENT"
needs_human_review = true
title = "Hash choice or security use not resolvable at scan time"
family = "hash"
why = "hashlib.new(name) where name is a variable, or usedforsecurity passed a non-constant on a weak-hash-capable call. Static analysis stops here by design: we record the call site and let a human read the surrounding code rather than guessing which branch runs. Restricted to weak algorithms: usedforsecurity is irrelevant to sha256 and the like, which stay approved regardless of the flag, so a non-constant flag there is not this finding."
[[rule.match]]
kind = "py_call"
targets = ["hashlib.new"]
algorithm = "unresolved"

[[rule.match]]
kind = "py_call"
targets = ["hashlib.md5", "hashlib.sha1", "hashlib.new"]
algorithm_list = "weak"
usedforsecurity = "unresolved"

[[rule]]
id = "PY_TLS_POLICY_OVERRIDE"
layer = "python"
category = "tls-policy"
severity = "medium"
confidence = "medium"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Overrides TLS protocol or cipher policy"
family = "tls"
why = "Applications should inherit the system crypto policy rather than set their own. Pinning ciphers or protocol versions in code means a host-level policy change, including enabling FIPS, will not reach this code path."
[rule.match]
kind = "py_call"
targets = ["ssl.SSLContext", "ssl.create_default_context", "ssl.wrap_socket", "*.set_ciphers"]

[[rule]]
id = "PY_TLS_VERSION_PINNED"
layer = "python"
category = "tls-policy"
severity = "medium"
confidence = "medium"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Pins a TLS version"
family = "tls"
why = "Assigning minimum_version or maximum_version fixes the protocol range in code, overriding the system policy in both directions."
[rule.match]
kind = "py_attr"
attributes = ["minimum_version", "maximum_version", "options"]

[[rule]]
id = "PY_LEGACY_TLS_PROTOCOL"
layer = "python"
category = "tls-policy"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "References a legacy TLS protocol constant"
family = "tls"
why = "PROTOCOL_TLSv1 and PROTOCOL_SSLv23 select protocol versions the system policy normally refuses. Code naming them explicitly is trying to go around that."
[rule.match]
kind = "py_constant"
constants = ["ssl.PROTOCOL_TLSv1", "ssl.PROTOCOL_TLSv1_1", "ssl.PROTOCOL_TLSv1_2", "ssl.PROTOCOL_SSLv2", "ssl.PROTOCOL_SSLv3", "ssl.PROTOCOL_SSLv23"]

[[rule]]
id = "PY_TLS_VERIFICATION_DISABLED"
layer = "python"
category = "tls-policy"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Assigns away certificate or hostname verification"
family = "tls"
why = "check_hostname = False or verify_mode = CERT_NONE. Strictly a transport security failure rather than a FIPS one, but it is the same mistake in the same family: code deciding it knows better than the system policy. Only the disabling assignments match, so setting check_hostname = True is not flagged."
[rule.match]
kind = "py_attr"
attributes = ["check_hostname", "verify_mode"]
values = ["False", "ssl.CERT_NONE"]

[[rule]]
id = "PY_TLS_UNVERIFIED_CONTEXT"
layer = "python"
category = "tls-policy"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "References an unverified TLS context or CERT_NONE"
family = "tls"
why = "ssl._create_unverified_context is a private function whose entire purpose is to skip verification, and a bare CERT_NONE reference is usually on its way to the same place. Separate from the assignment rule above because it is a plain name reference, which is a different thing to look for."
[rule.match]
kind = "py_constant"
constants = ["ssl.CERT_NONE", "ssl._create_unverified_context"]

[[rule]]
id = "PY_CTYPES_CRYPTO_LOAD"
layer = "python"
category = "dynamic-load"
severity = "high"
confidence = "high"
verdict = "CONDITIONAL"
needs_human_review = true
title = "Loads a crypto library through ctypes"
family = "library"
why = "A crypto library reached by name at runtime appears in no dependency graph and in no SBOM. Which copy gets loaded depends on the loader path at execution time, so the record cannot say and a human must."
[rule.match]
kind = "py_ctypes_load"
table = "ctypes_library"

[[rule]]
id = "PY_UNREADABLE"
layer = "python"
category = "opacity"
severity = "low"
confidence = "high"
needs_human_review = false
title = "Python file could not be parsed"
why = "A syntax error, an undecodable file, a file over the size limit, or one whose nesting exhausted the interpreter's own parsing stack -- commonly a test fixture, a file written for a different Python version, or (for the last cause) generated or minified code. Recorded so the file count and the findings can be reconciled; it carries no verdict because one unreadable file among many says little."
[rule.match]
kind = "scan_error"
error_kinds = ["python_syntax_error", "python_decode_error", "python_too_large", "python_recursion_limit_exceeded"]
