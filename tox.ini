[tox]
envlist = py311,py312,py313,py314,lint,pylint,docs
skip_missing_interpreters = true

[testenv]
description = run the offline test suite
deps =
    pytest>=8.0
passenv =
    WCS_REQUIRE_HOSTBIN
commands =
    pytest -m "not real" {posargs}

[testenv:lint]
description = ruff lint and format check
skip_install = true
deps =
    ruff>=0.12
commands =
    ruff check --select=E,F,W,PLC0415 {posargs:src tests}
    ruff format --check {posargs:src tests}

[testenv:pylint]
description = pylint the package
deps =
    pylint>=3.2
commands =
    pylint {posargs:src/wheel_crypto_scan}

[testenv:format]
description = apply ruff formatting
skip_install = true
deps =
    ruff>=0.12
commands =
    ruff format {posargs:src tests}

[testenv:real]
description = opt-in scan of real wheels from WCS_CORPUS_DIR
deps =
    pytest>=8.0
passenv =
    {[testenv]passenv}
    WCS_CORPUS_DIR
commands =
    pytest -m "real or hostbin" {posargs}

[testenv:docs]
description = build the MkDocs Material documentation site
skip_install = true
deps =
    mkdocs-material>=9.5
commands =
    mkdocs build --strict {posargs}
